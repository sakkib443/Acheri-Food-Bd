---
deployment:
  tasks:
    # App lives in ~/acheri, the public web root is ~/public_html.
    # (.env and the customised public_html/index.php are NOT touched.)
    - export APP=/home/acharifo/acheri
    - export PUB=/home/acharifo/public_html

    # --- application code -> ~/acheri ---
    - /bin/rm -rf $APP/app
    - /bin/cp -R app $APP/
    - /bin/rm -rf $APP/config
    - /bin/cp -R config $APP/
    - /bin/rm -rf $APP/database
    - /bin/cp -R database $APP/
    - /bin/rm -rf $APP/lang
    - /bin/cp -R lang $APP/
    - /bin/rm -rf $APP/resources
    - /bin/cp -R resources $APP/
    - /bin/rm -rf $APP/routes
    - /bin/cp -R routes $APP/
    - /bin/rm -rf $APP/vendor
    - /bin/cp -R vendor $APP/
    - /bin/cp -f bootstrap/app.php $APP/bootstrap/app.php
    - /bin/cp -f artisan $APP/artisan
    - /bin/cp -f composer.json $APP/composer.json
    - /bin/cp -f composer.lock $APP/composer.lock

    # --- compiled front-end assets -> ~/public_html/build ---
    - /bin/rm -rf $PUB/build
    - /bin/cp -R public/build $PUB/

    # --- favicon -> ~/public_html ---
    - /bin/cp -f public/favicon.svg $PUB/favicon.svg

    # --- images -> ~/public_html/images ---
    # Overlay copy (no rm): refreshes the optimized default banners/logo while
    # leaving any admin-uploaded images already on the server untouched.
    - /bin/mkdir -p $PUB/images
    - /bin/cp -Rf public/images/. $PUB/images/

    # --- performance: gzip + browser-cache rules for the web root ---
    - /bin/cp -f public/.htaccess $PUB/.htaccess

    # --- rebuild Laravel caches so the FIRST request after deploy is fast ---
    # (config + routes + views compiled ahead of time; OPcache warms on first hit)
    - cd $APP && /bin/rm -rf bootstrap/cache/*.php || true
    - cd $APP && php artisan optimize || true
